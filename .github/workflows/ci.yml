name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Las pruebas *PostgresIntegrationTest usan Testcontainers (Docker disponible en ubuntu-latest).
      # Las claves JWT/TOTP de prueba se generan al azar, no hace falta ningún secreto.
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      # Solo las dependencias que viajan a producción: las de desarrollo (eslint, vitest) no se publican.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright, API simulada)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
