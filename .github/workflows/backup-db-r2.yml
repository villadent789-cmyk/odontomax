name: Backup DB → Cloudflare R2

on:
  schedule:
    # 02:00 hora Lima (UTC-5) = 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BACKUP_FILE: odontomax_$(date +%Y%m%d_%H%M%S).sql.gz.enc

    steps:
      - name: Instalar cliente PostgreSQL 17 (Supabase usa la 17; el del runner es mas viejo y se niega a volcar)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcar base de datos (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Sin pipefail, si pg_dump falla gzip igual termina bien y se subiria una copia vacia sin avisar.
          set -o pipefail
          /usr/lib/postgresql/17/bin/pg_dump \
            --host="${{ secrets.DB_HOST }}" \
            --port="${{ secrets.DB_PORT || 5432 }}" \
            --username="${{ secrets.DB_USER }}" \
            --dbname="${{ secrets.DB_NAME }}" \
            --no-password \
            --format=custom \
            --schema=public \
            --no-owner \
            --no-privileges \
          | gzip \
          > dump_raw.sql.gz
          # Una base con las 76 migraciones pesa mucho mas que esto: si queda mas chica, el volcado salio incompleto.
          test "$(stat -c%s dump_raw.sql.gz)" -gt 20000

      - name: Cifrar con AES-256-CBC
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILENAME="odontomax_$(date +%Y%m%d_%H%M%S).sql.gz.enc"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
            -in dump_raw.sql.gz \
            -out "$FILENAME" \
            -pass "env:BACKUP_PASSPHRASE"
          rm -f dump_raw.sql.gz

      - name: Subir a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "$BACKUP_FILE" \
            "s3://${R2_BUCKET}/backups/${BACKUP_FILE}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

      - name: Eliminar backups de más de 30 días
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET}" \
            --prefix "backups/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" \
            --output text \
          | tr '\t' '\n' \
          | grep -v '^$' \
          | while read -r KEY; do
              aws s3 rm "s3://${R2_BUCKET}/${KEY}" \
                --endpoint-url "${R2_ENDPOINT}"
            done

      - name: Limpiar archivo local
        if: always()
        run: rm -f "$BACKUP_FILE" dump_raw.sql.gz
